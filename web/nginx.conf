server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve service names through Docker's DNS. Without this nginx keeps the api's IP from start-up,
  # and after the api container is recreated that IP can belong to a different container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location = /health { default_type application/json; return 200 '{"service":"web","status":"ok"}'; }

  # REST: /api/... -> api service (path without the /api prefix)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }
  # Live updates
  location /ws/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # ES-module files (the MapLibre worker) must be served as JavaScript
  location ~ \.mjs$ { types { } default_type application/javascript; }
  location / { try_files $uri /index.html; }
}
