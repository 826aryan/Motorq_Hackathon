# Every pull request (and push): lint, unit, chaos and integration tests, plus a dashboard build.
name: ci
on:
  pull_request:
  workflow_call:          # reused by deploy.yml, so nothing ships untested

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + chaos tests
        run: pytest tests/unit tests/chaos -q
      - name: "Integration test (Testcontainers: Redpanda, Redis Stack, PostGIS)"
        run: pytest tests/integration -q -s

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
